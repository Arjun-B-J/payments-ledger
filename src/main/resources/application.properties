spring.application.name=payments-ledger

# Database. With no spring.datasource.url set, an embedded PostgreSQL (zonky) starts in-process.
# To use a real server: SPRING_DATASOURCE_URL=jdbc:postgresql://host:5432/ledger plus
# SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
ledger.db.pool-size=20
# Optional: keep embedded data between runs, e.g. --ledger.db.embedded-data-dir=data/pg
ledger.db.embedded-data-dir=
ledger.db.embedded-port=0
# Embedded Postgres runs with fsync and synchronous_commit off by default (fast tests). Set true
# to make every commit wait for the disk, as a real ledger must; the benchmark reports both.
ledger.db.embedded-durable=false
spring.datasource.hikari.maximum-pool-size=${ledger.db.pool-size}
spring.flyway.locations=classpath:db/migration

# Balance update strategy: ROW_LOCK, ATOMIC or SHARDED.
ledger.strategy=ATOMIC
ledger.retry.max-attempts=5
ledger.retry.base-backoff-ms=2
ledger.retry.max-backoff-ms=100

# Outbox relay.
ledger.outbox.relay.enabled=true
ledger.outbox.relay.interval-ms=100
ledger.outbox.relay.batch-size=500

# Reconciler schedule.
ledger.reconciler.scheduled=true
ledger.reconciler.interval-ms=60000

# Set to "reconcile" to run the reconciler once, print JSON and exit (use with
# --spring.main.web-application-type=none).
ledger.cli=

spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.distribution.percentiles-histogram.ledger.transfer.latency=true

# Every log line carries the transfer id when one is in scope.
logging.pattern.level=%5p [transfer=%X{transferId:-}]
spring.task.scheduling.pool.size=2
