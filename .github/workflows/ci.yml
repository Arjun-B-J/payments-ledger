name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Tests start an embedded PostgreSQL from Maven artifacts; no database service is needed.
      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B verify
